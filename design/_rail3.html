            <div class="qa-rail qa-rail3">
              <div class="qa-section-label">Steps</div>
              <div class="qa-rail-item RAIL1">
                <span class="qa-num">1</span><span class="qa-step-icon">{{icon:text-cursor-input}}</span>
                <div class="qa-rail-text"><div class="qa-rail-title">Ask me</div><div class="qa-rail-sub">Rough idea or observation:</div></div>
                <span class="qa-pill is-unused">idea</span>
              </div>
              <div class="qa-rail-item RAIL2">
                <span class="qa-num">2</span><span class="qa-step-icon is-llm">{{icon:sparkles}}</span>
                <div class="qa-rail-text"><div class="qa-rail-title">Opus</div><div class="qa-rail-sub">Draft the note body</div></div>
                <span class="qa-pill is-unused">draft</span>
              </div>
              <div class="qa-rail-item RAIL3">
                <span class="qa-num">3</span><span class="qa-step-icon is-llm">{{icon:sparkles}}</span>
                <div class="qa-rail-text"><div class="qa-rail-title">Haiku</div><div class="qa-rail-sub">Short title</div></div>
                <span class="qa-pill is-unused">title</span>
              </div>
              <div class="qa-rail-item RAIL4">
                <span class="qa-num">4</span><span class="qa-step-icon">{{icon:file-plus}}</span>
                <div class="qa-rail-text"><div class="qa-rail-title">Create file</div><div class="qa-rail-sub">Slipbox/{{timestamp}} - {{title}}</div></div>
                <span class="qa-pill is-unused is-file">note</span>
              </div>
              <div class="qa-rail-item RAIL5">
                <span class="qa-num">5</span><span class="qa-step-icon">{{icon:external-link}}</span>
                <div class="qa-rail-text"><div class="qa-rail-title">Open file</div><div class="qa-rail-sub">note at ## Description</div></div>
              </div>
              <div style="padding: var(--size-4-2) var(--size-4-2) 0;"><button class="qa-add-step">{{icon:plus}}Add step</button></div>
            </div>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #1e1e1e; }
    a { color: var(--text-accent); } a:hover { color: var(--text-accent-hover); }
<!--OBSIDIAN_CSS-->
<!--INCLUDE:_qa.css-->
<!--INCLUDE:_qa2.css-->
<!--INCLUDE:_qa4.css-->
<!--INCLUDE:_qa5.css-->
  </style>
</helmet>
<div style="--qa-h: 720px;">
<!--INCLUDE:_frame-top.html-->
<!--INCLUDE:_actions-list.html-->
<!--INCLUDE:_frame-bottom.html-->
    <div class="modal-container mod-dim" style="z-index: 100;">
      <div class="modal-bg"></div>
      <div class="modal" style="--dialog-width: 560px;">
        <div class="modal-close-button clickable-icon">{{icon:x}}</div>
        <div class="modal-header"><div class="modal-title">Edit model</div></div>
        <div class="modal-content l3">
          <div class="l3-body" style="padding: 0;">
            <div class="setting-item">
              <div class="setting-item-info"><div class="setting-item-name">Name</div><div class="setting-item-description">How it appears in Ask a model steps.</div></div>
              <div class="setting-item-control"><input type="text" value="Opus" style="width: 220px;"></div>
            </div>
            <div class="setting-item">
              <div class="setting-item-info"><div class="setting-item-name">Provider</div></div>
              <div class="setting-item-control"><select class="dropdown"><option>Anthropic</option><option>OpenAI</option></select></div>
            </div>
            <div class="setting-item">
              <div class="setting-item-info"><div class="setting-item-name">Model ID</div><div class="setting-item-description">As the provider's API expects it.</div></div>
              <div class="setting-item-control"><input type="text" value="claude-opus-4-6" style="width: 220px; font-family: var(--font-monospace); font-size: 12.5px;"></div>
            </div>
            <div class="setting-item">
              <div class="setting-item-info"><div class="setting-item-name">API key</div><div class="setting-item-description">A secret from Settings › Keychain. The key itself never lives in this plugin's data.</div></div>
              <div class="setting-item-control"><select class="dropdown"><option>anthropic-api-key</option><option>openai-api-key</option><option>Add a secret in Keychain…</option></select></div>
            </div>
            <div class="setting-item">
              <div class="setting-item-info"><div class="setting-item-name">Connection</div><div class="setting-item-description"><span class="l3-ok">{{icon:check}}Replied in 0.6 s · claude-opus-4-6</span></div></div>
              <div class="setting-item-control"><button>Test</button></div>
            </div>
          </div>
          <div class="qa-footer">
            <button>Cancel</button>
            <button class="mod-cta">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

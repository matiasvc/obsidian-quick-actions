<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #1e1e1e; }
    a { color: var(--text-accent); } a:hover { color: var(--text-accent-hover); }
<!--OBSIDIAN_CSS-->
<!--INCLUDE:_qa.css-->
<!--INCLUDE:_qa2.css-->
<!--INCLUDE:_qa4.css-->
<!--INCLUDE:_qa5.css-->
    .RAIL4 { background: var(--background-modifier-hover); }
    .RAIL4 .l3-out { color: var(--text-accent); }
  </style>
</helmet>
<!--INCLUDE:_editor3-top.html-->
          <div style="display: flex; align-items: center; gap: var(--size-4-3);">
            <input type="text" value="Draft Slipbox Note" style="font-size: var(--font-ui-large); font-weight: var(--font-semibold); background: transparent; box-shadow: none; padding-inline-start: 0; width: 360px;">
            <span style="flex: 1;"></span>
            <button class="qa-add-step">{{icon:play}}Test run</button>
            <button class="clickable-icon" aria-label="Copy URI">{{icon:link}}</button>
          </div>

          <div class="qa-split l3">
<!--INCLUDE:_rail-slipbox.html-->
            <div class="qa-pane" style="position: relative;">
              <div class="l3-head">
                <span class="qa-num">4</span>
                <select class="dropdown"><option>Create file</option></select>
                <span style="flex: 1;"></span>
                <button class="clickable-icon" aria-label="More">{{icon:ellipsis}}</button>
              </div>
              <div class="l3-card">
                <div class="l3-band is-in">
                  <span class="qp-lead">In</span>
                  <span class="qp">idea</span>
                  <span class="qp">draft</span>
                  <span class="qp">title</span>
                  <span class="qp">date</span>
                  <span class="qp">timestamp</span>
                  <span class="qp is-off">time</span>
                </div>
                <div class="l3-body">
                  <div class="setting-item">
                    <div class="setting-item-info"><div class="setting-item-name">Path</div><div class="setting-item-description">.md is added if missing.</div></div>
                    <div class="setting-item-control"><div class="qa-field" style="width: 100%; width: 380px;">Slipbox/<span class="qp">timestamp</span> - <span class="qp">title</span></div></div>
                  </div>
                  <div class="setting-item is-stacked">
                    <div class="setting-item-info"><div class="setting-item-name">Content</div></div>
                    <div class="setting-item-control"><div class="qa-field" style="width: 100%; min-height: 200px; font-family: var(--font-monospace); font-size: 12.5px;">---
title: "<span class="qp">title</span>"
aliases: ["<span class="qp">title</span>"]
created: "<span class="qp">date</span>"
tags: ["note/slipbox"]
---

# <span class="qp">title</span>

## Description

<span class="qp">draft</span>

## Original idea

<span class="qp">idea</span></div></div>
                  </div>
                </div>
                <div class="l3-band is-out">
                  <span class="qp-lead">Out</span>
                  <span class="qp is-file">note</span>
                  <span class="l3-hint">the file this step creates · used by Open file</span>
                </div>
              </div>
            </div>
          </div>
<!--INCLUDE:_editor-bottom.html-->
</x-dc>
</body>
</html>

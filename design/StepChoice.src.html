<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #1e1e1e; }
    a { color: var(--text-accent); } a:hover { color: var(--text-accent-hover); }
<!--OBSIDIAN_CSS-->
<!--INCLUDE:_qa.css-->
<!--INCLUDE:_qa2.css-->
<!--INCLUDE:_qa4.css-->
<!--INCLUDE:_qa5.css-->
    .RAIL1 { background: var(--background-modifier-hover); }
    .RAIL1 .l3-out { color: var(--text-accent); }
  </style>
</helmet>
<!--INCLUDE:_editor3-top.html-->
          <div style="display: flex; align-items: center; gap: var(--size-4-3);">
            <input type="text" value="Log something" style="font-size: var(--font-ui-large); font-weight: var(--font-semibold); background: transparent; box-shadow: none; padding-inline-start: 0; width: 360px;">
            <span style="flex: 1;"></span>
            <button class="qa-add-step">{{icon:play}}Test run</button>
            <button class="clickable-icon" aria-label="Copy URI">{{icon:link}}</button>
          </div>

          <div class="qa-split l3">
<!--INCLUDE:_rail-choice.html-->
            <div class="qa-pane" style="position: relative;">
              <div class="l3-head">
                <span class="qa-num">1</span>
                <select class="dropdown"><option>Choice</option></select>
                <span style="flex: 1;"></span>
                <button class="clickable-icon" aria-label="More">{{icon:ellipsis}}</button>
              </div>
              <div class="l3-card">
                <div class="l3-band is-in">
                  <span class="qp-lead">In</span>
                  <span class="qp is-off">date</span>
                  <span class="qp is-off">time</span>
                  <span class="qp is-off">timestamp</span>
                  <span class="l3-hint">first step, nothing from above yet</span>
                </div>
                <div class="l3-body">
                  <div class="setting-item">
                    <div class="setting-item-info"><div class="setting-item-name">Question</div><div class="setting-item-description">Shown above the list.</div></div>
                    <div class="setting-item-control"><input type="text" value="Which log?"></div>
                  </div>
                  <div class="setting-item is-stacked">
                    <div class="setting-item-info"><div class="setting-item-name">Options</div></div>
                    <div class="setting-item-control"><div class="l3-options">
                      <div class="l3-option"><span class="qa-grip">{{icon:grip-vertical}}</span><input type="text" value="Daily log"><button class="clickable-icon" aria-label="Remove">{{icon:x}}</button></div>
                      <div class="l3-option"><span class="qa-grip">{{icon:grip-vertical}}</span><input type="text" value="Work log"><button class="clickable-icon" aria-label="Remove">{{icon:x}}</button></div>
                      <div class="l3-option"><span class="qa-grip">{{icon:grip-vertical}}</span><input type="text" value="Reading log"><button class="clickable-icon" aria-label="Remove">{{icon:x}}</button></div>
                      <div><button class="qa-add-step">{{icon:plus}}Add option</button></div>
                    </div></div>
                  </div>
                </div>
                <div class="l3-band is-out">
                  <span class="qp-lead">Out</span>
                  <span class="qp">where</span>
                  <span class="l3-hint">the option you pick, as text · used by Insert in section</span>
                </div>
              </div>
            </div>
          </div>
<!--INCLUDE:_editor-bottom.html-->
</x-dc>
</body>
</html>
